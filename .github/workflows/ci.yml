name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Mypy
        run: mypy

  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Confirm the pure-NumPy core is platform independent.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with PyTorch for the parity suite)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Show versions
        run: python -c "import numpy, torch, tinytorch; print('numpy', numpy.__version__); print('torch', torch.__version__); print('tinytorch', tinytorch.__version__)"
      - name: Run the full suite
        run: pytest -v

  no-torch:
    name: tests without PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime deps only
        # TinyTorch's only runtime dependency is NumPy. This job proves that:
        # if anything in src/ ever imports torch, it fails here.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Assert torch is genuinely absent
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"
      - name: Run the suite (parity tests should skip, not fail)
        run: pytest -v -rs

  examples:
    name: examples + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run every example end to end
        working-directory: examples
        run: |
          for script in 0*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
      - name: Run the benchmark (smoke, reduced iterations)
        run: python benchmarks/bench_overhead.py --iterations 20

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
